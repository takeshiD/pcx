[package]
name = "pcx-cli"
version = "0.1.1"
edition = "2024"
description = "A shell-native toolbox for inspecting and reducing point-cloud recordings on edge Linux systems"
readme = "README.md"
repository = "https://github.com/takeshiD/pcx"
homepage = "https://takeshid.github.io/pcx/"
license = "MIT"
include = [
    "/.github/release/README.md",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/README.ja.md",
    "/examples/**",
    "/generated/**",
    "/scripts/**",
    "/src/**",
    "/tests/**",
]
keywords = ["point-cloud", "robotics", "mcap", "lidar", "cli"]
categories = ["command-line-utilities", "science::robotics"]

[lib]
name = "pcx_cli"
path = "src/lib.rs"

[[bin]]
name = "pcx"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
las = { version = "0.11.1", features = ["laz"] }
mcap = { version = "0.25.0", default-features = false, features = ["zstd", "lz4"] }
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
clap_complete = "=4.5.58"
clap_mangen = "=0.2.29"
proptest = "1.9"
