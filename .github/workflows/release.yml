name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require an exact supported tag and matching Cargo version
        id: tag
        shell: bash
        run: |
          tag=${GITHUB_REF_NAME}
          if [[ "${tag}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version=${BASH_REMATCH[1]}
            prerelease=false
          elif [[ "${tag}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+)$ ]]; then
            version=${BASH_REMATCH[1]}
            prerelease=true
          else
            echo "Unsupported release tag: ${tag}" >&2
            exit 1
          fi
          cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "pcx-cli") | .version')
          if [[ "${version}" != "${cargo_version}" ]]; then
            echo "Tag version ${version} does not match Cargo.toml ${cargo_version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

  verify:
    name: Verify (${{ matrix.arch }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64-linux
          - runner: ubuntu-24.04-arm
            arch: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo check --all-targets --all-features --locked
      - run: cargo test --all-features --locked
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: takeshid
          skipPush: true
      - run: nix flake check --print-build-logs

  docs:
    name: Verify documentation
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/pages/package-lock.json
      - run: npm ci
        working-directory: docs/pages
      - run: npm run check
        working-directory: docs/pages
      - run: npm run build
        working-directory: docs/pages

  package:
    name: Verify crates.io package
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check generated shell and man assets
        run: ./scripts/generate-assets.sh --check
      - run: cargo package --locked
      - name: Build and install the extracted package
        shell: bash
        run: |
          package_dir="target/package/pcx-cli-${{ needs.validate.outputs.version }}"
          cargo build --manifest-path "${package_dir}/Cargo.toml" --locked
          cargo install --path "${package_dir}" --locked --root "${RUNNER_TEMP}/pcx-install"
          "${RUNNER_TEMP}/pcx-install/bin/pcx" --version

  binaries:
    name: Binary (${{ matrix.arch }})
    needs: [validate, verify, docs, package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64-linux
          - runner: ubuntu-24.04-arm
            arch: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo build --release --locked
      - name: Archive binary, shell completions, and manual pages
        shell: bash
        run: |
          ./scripts/package-release-archive.sh \
            target/release/pcx \
            "${{ needs.validate.outputs.version }}" \
            "${{ matrix.arch }}"
      - name: Verify release archive contents
        shell: bash
        run: |
          archive="pcx-${GITHUB_REF_NAME}-${{ matrix.arch }}.tar.xz"
          expected=$'LICENSE\nREADME.md\npcx\nshare/bash-completion/completions/pcx\nshare/fish/vendor_completions.d/pcx.fish'
          while IFS= read -r manual; do
            expected+=$'\n'"share/man/man1/${manual##*/}"
          done < <(find generated/man -maxdepth 1 -type f -name '*.1' | sort)
          expected+=$'\nshare/zsh/site-functions/_pcx'
          actual=$(tar -tJf "${archive}")
          if [[ "${actual}" != "${expected}" ]]; then
            printf 'Unexpected archive contents:\n%s\n' "${actual}" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pcx-${{ matrix.arch }}
          path: pcx-*.tar.xz
          if-no-files-found: error

  cachix:
    name: Publish Cachix (${{ matrix.arch }})
    needs: [validate, verify, docs, package]
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64-linux
          - runner: ubuntu-24.04-arm
            arch: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: takeshid
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix build .#pcx --print-build-logs

  publish:
    name: Publish crates.io and GitHub release
    needs: [validate, binaries, cachix]
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pcx-*
          path: dist
          merge-multiple: true
      - name: Authenticate to crates.io
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish pcx-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: cargo publish --locked
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        shell: bash
        run: |
          cd dist
          sha256sum ./*.tar.xz > SHA256SUMS
          args=(--generate-notes --title "${GITHUB_REF_NAME}")
          if [[ "${PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" ./*.tar.xz SHA256SUMS "${args[@]}"
