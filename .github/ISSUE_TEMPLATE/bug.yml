name: Bug report
description: Report reproducible incorrect behavior in pcx.
title: "bug: "
labels: ["type:bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here; use SECURITY.md.
  - type: input
    id: version
    attributes:
      label: pcx version
      placeholder: Output of pcx --version or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x86_64-linux
        - aarch64-linux
        - Unsupported platform
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the exact command and the smallest shareable input description.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and stderr
    validations:
      required: true
  - type: checkboxes
    id: sensitive
    attributes:
      label: Data safety
      options:
        - label: I removed credentials, private sensor data, and other secrets from this report.
          required: true
